<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>User Sign In — LAN Monitor</title>
  <link rel="stylesheet" href="/auth.css">
</head>
<body>
  <main class="auth-layout">
    <a class="brand" href="/">LAN Monitor</a>
    <section class="auth-card" aria-labelledby="page-title">
      <h1 id="page-title">Sign in</h1>
      <p class="card-intro">Sign in to your LAN Monitor account.</p>

      <form class="auth-form" data-auth-form="user-login" novalidate>
        <div class="field">
          <label for="user-email">Email address</label>
          <input id="user-email" name="email" type="email" autocomplete="username" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="user-password">Password</label>
          <div class="password-wrap">
            <input id="user-password" name="password" type="password" autocomplete="current-password" placeholder="Password" required>
            <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">Show</button>
          </div>
        </div>
        <button class="submit-button" type="submit">Sign in</button>
        <p class="form-message" role="status" aria-live="polite"></p>
      </form>

      <p class="auth-links">Need an account? <a href="/register.html">Register</a></p>
      <p class="auth-note"><a href="/admin-login.html">Administrator sign in</a></p>
    </section>
    <footer class="auth-footer">Smart LAN Security System</footer>
  </main>
  <script src="/auth.js" defer></script>
</body>
</html>
